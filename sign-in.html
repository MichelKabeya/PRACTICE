<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION</title>
    <link rel="icon" type="image/png" href="_favicon/android-chrome-512x512.png">
    <link rel="stylesheet" href="sign.css">
</head>
<body>
    <div class="container">

        <p>Contact Us</p>
        <a href="contact.html">
            <img src="./_images/account.png" width="50px" height="50px">
        </a>
    </div>
    <h2>Sign Up</h2>
    <form novalidate>
        <img src="./_images/user_form.png" width="60px" height="60px">
        <div class="name">
            <img src="./_images/user_account.png" width="15px" height="15px">
            <input type="text" placeholder="Full Name" required>
        </div>
        <div class="email">
            <img src="./_images/email.png" width="15px" height="15px">
            <div class="field">
                <div class="box">
                 <input type="email" placeholder="Email" required>
                </div>
                <p class="error">invalid</p>
                <p class="success">valid</p>
            </div>
        </div>
        <div class="password">
            <img src="./_images/padlock.png" width="15px" height="15px">
            <input type="password" placeholder="Password" required>
        </div>
        <div class="confirm">
            <input type="checkbox">
            <p>Accept Terms and Conditions</p>
        </div>
        <div class="go">
            <a href="logins.html">
              <p>Sign Up</p>
            </a>
        </div>   
    </form>
    <form name="review">
        <p>Complete a survey about my website</p>
        <button type="button" onclick="window.location.href='google.html'">Survey</button>
    </form>

        
</body>
</html>
